spring:
  profiles:
    active: ${ENV:local}
  application:
    name: PLAYMO-GATEWAY
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_FIRST
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          "[/**]":
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
          # No filters to prevent header manipulation during WebSocket handshake
        - id: sports-api-websocket
          uri: ws://localhost:8080
          predicates:
            - Path=/sports/ws/**
        
        - id: sports-api-core
          uri: http://localhost:8080
          predicates:
            - Path=/sports/**
          filters:
            - RemoveResponseHeader=Access-Control-Allow-Origin
            - RemoveResponseHeader=Vary
