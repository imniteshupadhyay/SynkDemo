<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Performance Report</title>
    <style>
        @page {
            size: A4;
            margin: 20mm;
            @bottom-left {
                content: "Director";
                font-weight: bold;
                font-size: 10pt;
            }
            @bottom-right {
                content: "Powered by ";
                font-weight: bold;
                font-size: 10pt;
            }
        }
        
        body {
            font-family: Arial, sans-serif;
            font-size: 12pt;
            line-height: 1.4;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            max-width: 250px;
            max-height: 150px;
            margin-bottom: 20px;
        }
        
        .title {
            font-size: 18pt;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .info-table {
            width: 100%;
            margin-bottom: 30px;
            border-collapse: collapse;
        }
        
        .info-table td {
            padding: 5px 10px;
            border: none;
        }
        
        .category-title {
            background-color: #d3d3d3;
            font-weight: bold;
            font-size: 14pt;
            padding: 8px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        
        .attributes-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        
        .attributes-table th,
        .attributes-table td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        
        .attributes-table th {
            background-color: #f5f5f5;
            font-weight: bold;
        }
        
        .attributes-table td:last-child {
            text-align: center;
        }
        
        .footer-logo {
            position: fixed;
            bottom: 10mm;
            right: 10mm;
            max-width: 150px;
            max-height: 60px;
        }
    </style>
</head>
<body>
    <div class="header">
        <img th:if="${academyLogo}" th:src="${academyLogo}" alt="Academy Logo" class="logo"/>
        <div class="title" th:text="${sportName + ' Player Performance Report'}"></div>
    </div>
    
    <table class="info-table">
        <tr>
            <td th:text="'Academy: ' + ${academyName}"></td>
            <td th:text="'Player: ' + ${playerName}"></td>
        </tr>
        <tr>
            <td th:text="'Coach: ' + ${coachName}"></td>
            <td th:if="${courseName}" th:text="'Course: ' + ${courseName}"></td>
        </tr>
    </table>
    
    <div th:each="category : ${categories}">
        <div class="category-title" th:text="${category.category}"></div>
        
        <table class="attributes-table" th:if="${category.attributes}">
            <thead>
                <tr>
                    <th>Attribute</th>
                    <th th:text="${category.attributes[0].type == 'RATING_1_5' ? 'Rating (1-5)' : 
                                   (category.attributes[0].type == 'DROPDOWN' ? 'Selection' : 
                                   (category.attributes[0].type == 'TEXT' ? 'Notes' : 'Value'))}"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="attr : ${category.attributes}">
                    <td th:text="${attr.name}"></td>
                    <td th:text="${#strings.isEmpty(attr.value) or attr.value == '0' ? 'N/A' : attr.value}"></td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <img src="https://sta-sportsrally-static-assets.s3.us-east-1.amazonaws.com/defaults/PlayMo_Logo.png" 
         alt="PlayMo Logo" class="footer-logo"/>
</body>
</html>
